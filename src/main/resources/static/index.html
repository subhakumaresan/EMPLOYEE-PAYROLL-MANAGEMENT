<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Payroll Management</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--navy:#101a3a;--navy2:#172653;--purple:#7357ff;--blue:#4388ff;--ink:#202943;--muted:#75809a;--bg:#f4f6fb;--line:#e8ebf3;--green:#159b72;--red:#d94b5b}*{box-sizing:border-box}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #dce1ed;border-radius:9px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7357ff18}button{border:0;border-radius:9px;padding:10px 15px;background:linear-gradient(110deg,var(--purple),var(--blue));color:#fff;font-weight:600;cursor:pointer;transition:.2s}button:hover{transform:translateY(-1px);filter:brightness(1.04)}button.secondary{background:#eef0ff;color:#5846d8}button.danger{background:#fff0f1;color:#c83b4b}button.success{background:#e8f8f1;color:#12815d}.small{padding:6px 10px;font-size:12px}#login{width:min(410px,calc(100% - 32px));margin:9vh auto;background:#fff;padding:34px;border-radius:20px;box-shadow:0 18px 55px #1a245018}#login .brand{font-size:13px;color:var(--purple);font-weight:800;letter-spacing:2px}#login h1{margin:9px 0 6px;font-size:27px}#login p{color:var(--muted);font-size:13px;line-height:1.5}#login input,#login select{margin:7px 0}#login button{width:100%;margin-top:12px}#app{display:none;min-height:100vh}#side{position:fixed;inset:0 auto 0 0;width:245px;background:linear-gradient(180deg,var(--navy),#0b1430);color:#fff;padding:24px 15px;overflow:auto;z-index:5}#side .brand{font-size:19px;font-weight:800;padding:5px 12px 28px;letter-spacing:.3px}#side .brand span{color:#a99cff}#side .navlabel{font-size:10px;color:#7f8bb3;letter-spacing:1.5px;padding:12px 12px 7px}#side a{display:flex;gap:12px;align-items:center;padding:12px;border-radius:10px;color:#c0c9e3;cursor:pointer;font-size:14px;margin:3px 0}#side a:hover,#side a.on{background:linear-gradient(100deg,#765bff45,#3985ff25);color:white}#side .logout{margin-top:24px;color:#ffbfc6}#main{margin-left:245px;padding:28px 32px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:15px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:var(--muted);font-size:13px}.profile{background:#fff;border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #17234a08}.card h3{margin:0 0 16px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:15px}.stat{padding:18px}.stat small{color:var(--muted);font-size:12px}.stat b{display:block;font-size:27px;margin-top:10px;color:var(--ink)}.stat .tag{font-size:11px;color:var(--green);margin-top:4px}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;align-items:end}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}td,th{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#7d879e;background:#fafbfe}tr:hover td{background:#fbfcff}.badge{display:inline-block;border-radius:30px;padding:4px 9px;font-size:11px;background:#eef0ff;color:#5e4bd2}.badge.green{background:#e8f8f1;color:#12815d}.badge.red{background:#fff0f1;color:#c83b4b}.badge.amber{background:#fff5df;color:#a66b0a}.muted{color:var(--muted)}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.empty{padding:24px;text-align:center;color:var(--muted)}.money{font-weight:700;color:#604ce0}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.toolbar input{max-width:260px}.summary{background:linear-gradient(110deg,#171f49,#4032a0);color:#fff;border-radius:14px;padding:20px}.summary strong{font-size:29px;display:block;margin-top:7px}.summary small{color:#d5d5ff}.hidden{display:none!important}#msg{position:fixed;right:20px;top:20px;padding:13px 18px;border-radius:10px;color:#fff;display:none;z-index:20;box-shadow:0 10px 30px #0002}.modal{position:fixed;inset:0;background:#101a3a80;display:none;align-items:center;justify-content:center;z-index:15;padding:20px}.modalbox{width:min(560px,100%);background:#fff;border-radius:16px;padding:22px}.modalbox h3{margin-top:0}.pill{display:inline-flex;padding:6px 10px;border-radius:8px;background:#f1efff;color:#5e4bd2;font-size:12px}@media(max-width:850px){#side{width:205px}#main{margin-left:205px;padding:20px}.split{grid-template-columns:1fr}}@media(max-width:620px){#side{position:static;width:auto;height:auto;padding:12px}#side .brand{padding:7px 10px 12px}#side .navlabel{display:none}#nav{display:flex;overflow:auto;gap:4px}#side a{white-space:nowrap;padding:9px;font-size:12px}#side .logout{margin:5px 0}#main{margin:0;padding:15px}.top{align-items:flex-start}.top h1{font-size:21px}.profile{display:none}.split{display:block}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat b{font-size:22px}}

.report-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:27px 30px;margin-bottom:18px;border-radius:17px;background:linear-gradient(115deg,#111d3d,#263e70);color:#fff;box-shadow:0 12px 28px #17234a18}.report-hero h2{font-size:25px;margin:8px 0}.report-hero p{color:#d4deef;margin:0;max-width:620px;font-size:13px;line-height:1.6}.report-kicker{font-size:10px;letter-spacing:1.7px;color:#aebfe0;font-weight:800}.report-mark{width:72px;height:72px;border:1px solid #ffffff50;border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.6;font-weight:800;color:#dce7fa;background:#ffffff12}.report-controls{padding:22px}.report-stats .stat b{font-size:22px}.net-chip{padding:10px 15px;border-radius:11px;background:#edf8f3;color:#147a59;min-width:145px}.net-chip small{display:block;font-size:9px;letter-spacing:1px;font-weight:800}.net-chip strong{font-size:18px;display:block;margin-top:4px}@media(max-width:620px){.report-hero{padding:20px}.report-mark{width:55px;height:55px;flex-shrink:0}.net-chip{min-width:unset}}
</style></head><body><div id="msg"></div>
<div id="login"><div class="brand">EMPLOYEE PAYROLL MANAGEMENT</div><h1>Welcome back</h1><p>Sign in to manage employee information, salaries and payroll.</p><div class="field"><label>Login as</label><select id="role"><option value="admin">Administrator</option><option value="employee">Employee</option></select></div><div class="field"><label>Username</label><input id="user" placeholder="Enter username" autocomplete="username"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="Enter password" autocomplete="current-password"></div><button onclick="login()">Sign in to dashboard</button></div>
<div id="app"><aside id="side"><div class="brand">ABC <span>PAYROLL</span></div><div class="navlabel">WORKSPACE</div><div id="nav"></div><a class="logout" onclick="logout()">↪ &nbsp; Sign out</a></aside><main id="main"></main></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me,loanApps=[],emps=[],lastCalc=null,chart,reportRows=[];
function note(t,ok=true){let m=$('#msg');m.textContent=t;m.style.background=ok?'#159b72':'#d94b5b';m.style.display='block';setTimeout(()=>m.style.display='none',3200)}
async function api(p,m='GET',b){let r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.error||'Request failed')}if(r.headers.get('content-type')?.includes('application/pdf'))return r.blob();if(p.includes('csv'))return r.text();return r.json()}
const go=f=>f().catch(e=>note(e.message,false)),val=id=>document.getElementById(id)?.value||'';
const money=v=>'₹'+Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});
const table=(rows,cols)=>!rows?.length?'<div class="empty">No records found.</div>':'<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>'<td>'+(typeof c[1]==='function'?c[1](r):esc(r[c[1]]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const field=(label,id,placeholder='',type='text',value='')=>`<div class="field"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}"></div>`;
const empSel=()=>`<div class="field"><label>Employee</label><select id="emp">${emps.map(e=>`<option value="${e.id}">${esc(e.emp_code)} - ${esc(e.name)}</option>`).join('')}</select></div>`;
async function login(){go(async()=>{me=await api('login','POST',{username:val('user'),password:val('pass'),role:val('role')});start()})}async function logout(){await api('logout','POST');location.reload()}
function start(){$('#login').style.display='none';$('#app').style.display='block';let tabs=me.role==='admin'?['Dashboard','Employees','Salary Management','Bonuses','Deductions','Loans','Payroll','Reports']:['My Dashboard','My Salary','My Bonuses','My Deductions','My Loans','My Payslips'];$('#nav').innerHTML=tabs.map((t,i)=>`<a onclick="show('${t}')" id="t${t}">${['▦','♙','₹','✦','−','↗','▤','▧'][i]||'•'} &nbsp; ${t}</a>`).join('');show(tabs[0])}
function show(t){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.id==='t'+t));go(()=>views[t]())}const out=h=>$('#main').innerHTML=`<div class="top"><div><h1>${esc((window.currentView||'').replace('My ','')||'Payroll')}</h1><p>ABC Employee Services · Payroll workspace</p></div><div class="profile">${esc(me.name)} &nbsp;·&nbsp; ${esc(me.role.toUpperCase())}</div></div>${h}`;
function status(v){let c=v==='Active'||v==='Processed'||v==='Completed'?'green':v==='Rejected'||v==='Inactive'?'red':'amber';return `<span class="badge ${c}">${esc(v)}</span>`}
const views={
async Dashboard(){window.currentView='Dashboard';let d=await api('dashboard');out(`<div class="grid"><div class="card stat"><small>Total employees</small><b>${d.employees}</b><div class="tag">${d.active} active</div></div><div class="card stat"><small>Pending loan requests</small><b>${d.pendingLoans}</b></div><div class="card stat"><small>Active loan balance</small><b>${money(d.loanBalance)}</b></div><div class="card stat"><small>Payroll records processed</small><b>${d.payrollCount}</b></div></div><div class="split"><div class="card"><h3>Monthly payroll trend</h3><canvas id="payChart" height="145"></canvas></div><div class="card"><h3>Employees by department</h3><canvas id="deptChart" height="190"></canvas></div></div><div class="card"><h3>Recent payroll</h3>${table(d.recentPayroll,[['Month','month'],['Employee','name'],['Net salary',r=>money(r.net)]])}</div>`);if(chart)chart.forEach(x=>x.destroy());if(window.Chart){chart=[new Chart($('#payChart'),{type:'bar',data:{labels:(d.monthlyPayroll||[]).slice().reverse().map(x=>x.month),datasets:[{label:'Net payroll',data:(d.monthlyPayroll||[]).slice().reverse().map(x=>x.total),backgroundColor:'#7357ff',borderRadius:7}]},options:{responsive:true,plugins:{legend:{display:false}}}}),new Chart($('#deptChart'),{type:'doughnut',data:{labels:d.departments.map(x=>x.department),datasets:[{data:d.departments.map(x=>x.n),backgroundColor:['#7357ff','#4388ff','#25b99a','#f5b84b','#ef7185']}]},options:{plugins:{legend:{position:'bottom'}}}})]}},
async Employees(){window.currentView='Employee Management';emps=await api('employees');out(`<div class="card"><h3>Add employee</h3><div class="row">${field('Full name','n','Employee name')}${field('Email','e','name@company.com','email')}${field('Department','dp','Department')}${field('Designation','ds','Designation')}<div class="field"><label>Gender</label><select id="gen"><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option></select></div>${field('Phone','ph','Phone number')}${field('Joining date','jd','','date')}${field('Address','addr','Address')}${field('Username','un','Login username')}${field('Password','pw','Minimum 6 characters','password')}</div><h3 style="margin-top:18px">Initial salary</h3><div class="row">${field('Basic salary','b','0','number')}${field('HRA','h','0','number')}${field('DA','da','0','number')}${field('Travel','tr','0','number')}${field('Medical','md','0','number')}${field('Other','ot','0','number')}</div><div class="actions"><button onclick="addEmp()">+ Add employee</button></div></div><div class="card"><div class="toolbar"><h3>Employee directory</h3><input id="empSearch" placeholder="Search employee..." oninput="filterTable('empTable',this.value)"></div><div id="empTable">${table(emps,[['ID','emp_code'],['Name','name'],['Email','email'],['Department','department'],['Designation','designation'],['Status',r=>status(r.status)],['Actions',r=>`<button class="small secondary" onclick="editEmp(${r.id})">Edit</button> <button class="small danger" onclick="deleteEmp(${r.id})">Delete</button>`]])}</div></div>`)},
async 'Salary Management'(){window.currentView='Salary Management';emps=await api('employees');let r=await api('salaries'),hist=await api('salary-history');out(`<div class="card"><h3>Update salary structure</h3><div class="row">${empSel()}${field('Basic salary','sb','0','number')}${field('HRA','sh','0','number')}${field('DA','sda','0','number')}${field('Travel','st','0','number')}${field('Medical','sm','0','number')}${field('Other','so','0','number')}</div><div class="actions"><button onclick="saveSalary()">Save salary revision</button></div><p class="muted">Each revision is stored with an effective date. Processed payroll records remain unchanged.</p></div><div class="card"><h3>Current salary structure</h3>${table(r,[['Employee ID','emp_code'],['Employee','name'],['Basic',x=>money(x.basic)],['HRA',x=>money(x.hra)],['DA',x=>money(x.da)],['Travel',x=>money(x.travel)],['Medical',x=>money(x.medical)],['Other',x=>money(x.other)],['Effective date','effective_date']])}</div><div class="card"><h3>Salary revision history</h3>${table(hist,[['Employee ID','emp_code'],['Employee','name'],['Basic',x=>money(x.basic)],['HRA',x=>money(x.hra)],['DA',x=>money(x.da)],['Travel',x=>money(x.travel)],['Medical',x=>money(x.medical)],['Other',x=>money(x.other)],['Effective date','effective_date']])}</div>`)},
async Bonuses(){window.currentView='Bonus Management';emps=await api('employees');let r=await api('bonuses');out(`<div class="card"><h3>Add bonus</h3><div class="row">${empSel()}<div class="field"><label>Bonus type</label><select id="bt"><option>Performance Bonus</option><option>Festival Bonus</option><option>Annual Bonus</option><option>Incentive</option><option>Other Bonus</option></select></div>${field('Amount','ba','Amount','number')}${field('Bonus date','bd','','date')}${field('Description','bs','Optional description')}</div><div class="actions"><button onclick="addBonus()">Add bonus</button></div></div><div class="card"><h3>Bonus history</h3>${table(r,[['Employee','name'],['Type','type'],['Amount',x=>money(x.amount)],['Date','bonus_date'],['Processed',x=>status(x.processed?'Processed':'Pending')]])}</div>`)},
async Deductions(){window.currentView='Deduction Management';emps=await api('employees');let r=await api('deductions');out(`<div class="card"><h3>Add employee-specific deduction</h3><div class="row">${empSel()}<div class="field"><label>Deduction type</label><select id="dt"><option>PF</option><option>Professional Tax</option><option>Insurance</option><option>Other Deductions</option></select></div>${field('Amount','da2','Amount','number')}${field('Payroll month','dm','','month')}${field('Description','dsc','Description')}</div><div class="actions"><button onclick="addDed()">Add deduction</button></div><p class="muted">Deductions are applied only to the selected employee and month. Loan EMI is calculated separately from active loans.</p></div><div class="card"><h3>Deduction history</h3>${table(r,[['Employee','name'],['Type','type'],['Amount',x=>money(x.amount)],['Month','month'],['Status',x=>status(x.processed?'Processed':'Pending')]])}</div>`)},
async Loans(){window.currentView='Loan Management';let a=await api('loans/applications'),rp=await api('loans/repayments');loanApps=a;if(me.role==='admin')out(`<div class="card"><h3>Employee loan applications</h3>${table(a,[['Employee','name'],['Requested amount',x=>money(x.amount)],['Reason','reason'],['Preferred EMI',x=>money(x.emi)],['Applied','applied_date'],['Status',x=>status(x.status)],['Action',x=>x.status==='Pending'?`<button class="small success" onclick="openLoanDecision(${x.id},true)">Approve</button> <button class="small danger" onclick="openLoanDecision(${x.id},false)">Reject</button>`:'—']])}</div><div class="card"><h3>Loan repayment history</h3>${table(rp,[['Loan ID','loan_id'],['Month','month'],['Paid',x=>money(x.amount)],['Balance',x=>money(x.balance_after)]])}</div>`);else out(`<div class="card"><h3>Apply for an optional employee loan</h3><p class="muted">Applying is your choice. No loan EMI is deducted unless your application is approved and the loan becomes active.</p><div class="row">${field('Requested amount','la','Loan amount','number')}${field('Preferred monthly EMI','le','Monthly EMI','number')}${field('Reason for loan','lr','Reason')}</div><div class="actions"><button onclick="applyLoan()">Submit loan application</button></div></div><div class="card"><h3>My loan applications</h3>${table(a,[['Date','applied_date'],['Amount',x=>money(x.amount)],['EMI',x=>money(x.emi)],['Application status',x=>status(x.status)],['Loan balance',x=>x.balance==null?'—':money(x.balance)],['Loan status',x=>x.loan_status?status(x.loan_status):'—']])}</div><div class="card"><h3>Repayment history</h3>${table(rp,[['Month','month'],['Paid',x=>money(x.amount)],['Balance',x=>money(x.balance_after)]])}</div>` )},
async Payroll(){window.currentView='Payroll Processing';emps=await api('employees');out(`<div class="card"><h3>Calculate and process monthly payroll</h3><div class="row">${empSel()}${field('Payroll month','pm','','month')}</div><div class="actions"><button onclick="calc()">Calculate payroll</button><button class="secondary" onclick="proc()">Process payroll</button><button class="secondary" onclick="resetCalc()">Reset</button></div></div><div id="calcBox"></div>`)},
async Reports(){window.currentView='Payroll Reports';reportRows=await api('payroll');let now=new Date(),month=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');out(`<div class="report-hero"><div><span class="report-kicker">FINANCE &amp; HUMAN RESOURCES</span><h2>Payroll reports</h2><p>Generate accurate monthly payroll registers and individual employee payslips from processed records.</p></div><div class="report-mark">PDF<br>CSV</div></div><div class="card report-controls"><div class="toolbar"><div><h3>Monthly report</h3><p class="muted">Choose a payroll month to preview or export.</p></div><span class="pill">Database connected</span></div><div class="row">${field('Payroll month','rm','','month',month)}</div><div class="actions"><button onclick="previewReport()">Preview report</button><button class="secondary" onclick="monthlyPdf()">Download PDF report</button><button class="secondary" onclick="csv()">Download CSV</button></div></div><div id="reportPreview"><div class="card empty">Select a month and choose Preview report to view its payroll summary.</div></div><div class="card"><div class="toolbar"><div><h3>Individual payslips</h3><p class="muted">Download a detailed payslip for any processed employee.</p></div></div>${table(reportRows,[['Employee ID','emp_code'],['Employee','name'],['Department','department'],['Month','month'],['Gross',x=>money(x.gross)],['Bonus',x=>money(x.bonus)],['Loan EMI',x=>money(x.loan_emi)],['Deductions',x=>money(x.total_deductions)],['Net salary',x=>money(x.net)],['Payslip',x=>`<button class="small secondary" onclick="payslip(${x.employee_id},'${x.month}')">Download PDF</button>`]])}</div>`)},
async 'My Dashboard'(){window.currentView='My Dashboard';let p=await api('employee/profile'),r=p[0]||{};out(`<div class="grid"><div class="card stat"><small>Employee ID</small><b>${esc(r.emp_code)}</b></div><div class="card stat"><small>Department</small><b style="font-size:20px">${esc(r.department)}</b></div><div class="card stat"><small>Basic salary</small><b>${money(r.basic)}</b></div></div><div class="card"><h3>Welcome, ${esc(r.name)}</h3><p>${esc(r.designation)} · ${esc(r.email)}</p><p class="muted">Use My Loans to apply for an optional loan. Loan deductions apply only after admin approval and activation.</p></div>`)},
async 'My Salary'(){window.currentView='My Salary';let r=(await api('employee/profile'))[0]||{};out(`<div class="card"><h3>Current salary structure</h3>${table([r],[['Basic',x=>money(x.basic)],['HRA',x=>money(x.hra)],['DA',x=>money(x.da)],['Travel',x=>money(x.travel)],['Medical',x=>money(x.medical)],['Other',x=>money(x.other)],['Effective date','effective_date']])}</div>`)},
async 'My Bonuses'(){window.currentView='My Bonuses';let r=await api('bonuses');out(`<div class="card"><h3>My bonus history</h3>${table(r,[['Type','type'],['Amount',x=>money(x.amount)],['Date','bonus_date'],['Status',x=>status(x.processed?'Processed':'Pending')],['Description','description']])}</div>`)},
async 'My Deductions'(){window.currentView='My Deductions';let r=await api('deductions');out(`<div class="card"><h3>My deduction history</h3>${table(r,[['Type','type'],['Amount',x=>money(x.amount)],['Month','month'],['Status',x=>status(x.processed?'Processed':'Pending')],['Description','description']])}</div>`)},
async 'My Loans'(){window.currentView='My Loans';await views.Loans()},
async 'My Payslips'(){window.currentView='My Payslips';let r=await api('payroll');out(`<div class="card"><h3>My processed payslips</h3>${table(r,[['Month','month'],['Gross',x=>money(x.gross)],['Bonus',x=>money(x.bonus)],['Loan EMI',x=>money(x.loan_emi)],['Total deductions',x=>money(x.total_deductions)],['Net salary',x=>money(x.net)],['Download',x=>`<button class="small secondary" onclick="payslip(${x.employee_id},'${x.month}')">Download PDF</button>`]])}</div>`)}}

function previewReport(){let m=val('rm');if(!m)return note('Select a payroll month',false);let rows=reportRows.filter(r=>r.month===m),sum=k=>rows.reduce((a,r)=>a+Number(r[k]||0),0);$('#reportPreview').innerHTML=`<div class="grid report-stats"><div class="card stat"><small>Employees paid</small><b>${rows.length}</b><div class="tag">${m} payroll period</div></div><div class="card stat"><small>Gross payroll</small><b>${money(sum('gross'))}</b></div><div class="card stat"><small>Bonuses</small><b>${money(sum('bonus'))}</b></div><div class="card stat"><small>Total deductions</small><b>${money(sum('total_deductions'))}</b></div></div><div class="card"><div class="toolbar"><div><h3>Monthly payroll register · ${esc(m)}</h3><p class="muted">${rows.length} processed employee record(s). Loan EMI is included only for approved, active loans.</p></div><div class="net-chip"><small>NET PAYROLL</small><strong>${money(sum('net'))}</strong></div></div>${table(rows,[['Employee ID','emp_code'],['Employee','name'],['Department','department'],['Gross',r=>money(r.gross)],['Bonus',r=>money(r.bonus)],['Loan EMI',r=>money(r.loan_emi)],['Deductions',r=>money(r.total_deductions)],['Net salary',r=>money(r.net)]])}</div>`}

async function addEmp(){await go(async()=>{await api('employees','POST',{name:val('n'),email:val('e'),department:val('dp'),designation:val('ds'),gender:val('gen'),phone:val('ph'),joiningDate:val('jd'),address:val('addr'),username:val('un'),password:val('pw'),basic:val('b'),hra:val('h'),da:val('da'),travel:val('tr'),medical:val('md'),other:val('ot')});note('Employee added successfully');views.Employees()})}
async function editEmp(id){let e=emps.find(x=>x.id===id);if(!e)return;$('#modalbox').innerHTML=`<h3>Edit employee</h3><div class="row">${field('Full name','en', '', 'text',e.name)}${field('Email','ee','','email',e.email)}${field('Department','edp','', 'text',e.department)}${field('Designation','eds','', 'text',e.designation)}${field('Phone','eph','', 'text',e.phone||'')}<div class="field"><label>Status</label><select id="est"><option ${e.status==='Active'?'selected':''}>Active</option><option ${e.status==='Inactive'?'selected':''}>Inactive</option></select></div></div><div class="actions"><button onclick="saveEmp(${id})">Save changes</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;$('#modal').style.display='flex'}
async function saveEmp(id){await go(async()=>{await api('employees/'+id,'PUT',{name:val('en'),email:val('ee'),department:val('edp'),designation:val('eds'),phone:val('eph'),status:val('est')});closeModal();note('Employee updated');views.Employees()})}
async function deleteEmp(id){if(!confirm('Delete/deactivate this employee? Existing payroll history will be preserved.'))return;await go(async()=>{let r=await api('employees/'+id,'DELETE');note(r.message||'Employee removed');views.Employees()})}
function closeModal(){$('#modal').style.display='none'}function filterTable(id,q){let root=document.getElementById(id);if(!root)return;root.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}
async function saveSalary(){await go(async()=>{await api('salaries','POST',{empId:val('emp'),basic:val('sb'),hra:val('sh'),da:val('sda'),travel:val('st'),medical:val('sm'),other:val('so')});note('Salary revision saved');views['Salary Management']()})}
async function addBonus(){await go(async()=>{await api('bonuses','POST',{empId:val('emp'),type:val('bt'),amount:val('ba'),date:val('bd'),description:val('bs')});note('Bonus added');views.Bonuses()})}async function addDed(){await go(async()=>{await api('deductions','POST',{empId:val('emp'),type:val('dt'),amount:val('da2'),month:val('dm'),description:val('dsc')});note('Deduction added');views.Deductions()})}
async function applyLoan(){await go(async()=>{await api('loans/apply','POST',{amount:val('la'),emi:val('le'),reason:val('lr')});note('Loan application submitted. No deduction until approval and activation.');views.Loans()})}
function openLoanDecision(id,ok){let a=loanApps.find(x=>Number(x.id)===Number(id));if(!a)return note('Application not found',false);
$('#modalbox').innerHTML=ok?`<h3>Approve loan application</h3><p class="muted">${esc(a.name)} · requested ${money(a.amount)} · ${esc(a.reason||'')}</p><div class="row">${field('Approved loan amount','lamt','','number',a.amount)}${field('Monthly EMI','lemi','','number',a.emi)}${field('Loan start month','lmon','','month',new Date().toISOString().slice(0,7))}</div><div class="actions"><button onclick="submitLoanDecision(${Number(id)},true)">Approve loan</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`:`<h3>Reject loan application</h3><p class="muted">Reject ${esc(a.name)}'s request for ${money(a.amount)}?</p><div class="actions"><button class="danger" onclick="submitLoanDecision(${Number(id)},false)">Yes, reject</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;
$('#modal').style.display='flex'}
async function submitLoanDecision(id,ok){await go(async()=>{let b={id:String(id),approve:ok};if(ok){b.amount=val('lamt');b.emi=val('lemi');b.startMonth=val('lmon');if(!b.amount||!b.emi||!b.startMonth)return note('Please fill amount, EMI and start month',false)}await api('loans/decide','POST',b);closeModal();note(ok?'Loan approved and activated':'Loan application rejected');views.Loans()})}
async function calc(){await go(async()=>{lastCalc=await api(`payroll/calc?empId=${val('emp')}&month=${val('pm')}`);let r=lastCalc,rows=[['Basic and allowances',r.gross],['Bonus',r.bonus],['Gross earnings including bonus',r.totalEarnings],['Optional loan EMI',r.loanEmi],['Provident Fund',r.pf],['Professional Tax',r.ptax],['Insurance',r.insurance],['Other deductions',r.otherDeductions],['Total deductions',r.totalDeductions]];$('#calcBox').innerHTML=`<div class="card"><div class="toolbar"><div><h3>${esc(r.name)} · ${esc(r.month)}</h3><p class="muted">${esc(r.department)} · ${esc(r.designation)}</p></div><span class="pill">Payroll preview</span></div>${table(rows,[['Component',x=>x[0]],['Amount',x=>money(x[1])]])}<div class="summary"><small>FINAL TAKE-HOME SALARY</small><strong>${money(r.net)}</strong><small>Loan deduction is zero when no active approved loan exists.</small></div></div>`})}
async function proc(){if(!val('pm'))return note('Select a payroll month',false);if(!confirm('Process payroll? This records salary and updates loan balances.'))return;await go(async()=>{await api('payroll/process','POST',{empId:val('emp'),month:val('pm')});note('Payroll processed successfully');await calc()})}function resetCalc(){lastCalc=null;$('#calcBox').innerHTML=''}
function saveBlob(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}async function payslip(id,m){await go(async()=>saveBlob(await api(`reports/payslip/${id}?month=${m}`),`payslip-${id}-${m}.pdf`))}async function monthlyPdf(){if(!val('rm'))return note('Select a report month',false);await go(async()=>saveBlob(await api(`reports/monthly.pdf?month=${val('rm')}`),`monthly-payroll-${val('rm')}.pdf`))}async function csv(){if(!val('rm'))return note('Select a report month',false);await go(async()=>saveBlob(new Blob([await api('payroll/csv?month='+val('rm'))],{type:'text/csv'}),`payroll-${val('rm')}.csv`))}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#login').style.display!=='none')login()});fetch('/api/me').then(r=>r.ok?r.json():null).then(m=>{if(m){me=m;start()}});$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
</script></body></html>
